<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reA1ity R3cAlIbrAt10n</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
    }
    canvas {
      display: block;
    }

    .button-row {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 10;
    }

    .pill {
      font-family: monospace;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 999px;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px rgba(0,0,0,1), 0 2px 10px rgba(0,0,0,1);
      text-decoration: none;
      cursor: pointer;
      border: 2px solid transparent;
      background: #000000;
      color: #ffffff;
    }
    .blue-pill {
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.7), 0 0 32px rgba(77, 166, 255, 0.4);
    }
    .blue-pill:hover {
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.9), 0 0 40px rgba(126, 200, 255, 0.5);
    }
    .red-pill {
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.7), 0 0 32px rgba(255, 42, 42, 0.4);
    }
    .red-pill:hover {
      box-shadow: 0 0 24px rgba(255, 80, 80, 0.9), 0 0 40px rgba(255, 80, 80, 0.5);
    }
    .green-pill {
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.7), 0 0 32px rgba(57, 255, 20, 0.4);
    }
    .green-pill:hover {
      box-shadow: 0 0 24px rgba(100, 255, 60, 0.9), 0 0 40px rgba(100, 255, 60, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="button-row">
    <a href="#" class="pill blue-pill" id="bluePill">Blue Pill</a>
    <a href="#" class="pill green-pill" id="greenPill">Green Pill</a>
    <a href="homepage.html" class="pill red-pill" id="redPill">Red Pill</a>
  </div>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const classic = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  
    const phrases = [
      '**7LEVEL-RECORDS**',
      '//ELEMENTX//',
      '*SAVAGE-VERSES*',
      '*OUTBREAK*',
      '*INNOCULATION*',
      '+THE-MAD-HATTER+',
      '*GEN0CYD3=ORIJYN*',
      '*THE-HALLOW-THE-HALLOW*',
      '+SAVAGE-DAFFY-GEN0CYD3+',
      '!SAVAGE-DAFFY!',
      '!WICKED-SHIT-RAP-BOYS!',
      '^RUN-RABBIT-RUN^'
    ];

    // colorMode: 0 = original red, 1 = purple, 2 = yellow, 3 = multicolored
    let colorMode = 0;
    let isPaused = false;
    const bluePill = document.getElementById('bluePill');
    const greenPill = document.getElementById('greenPill');
    const redPill = document.getElementById('redPill');

    const modeLabels = ['Blue Pill', 'Stay In Matrix', 'Stay In Matrix', 'Stay In Matrix'];

    bluePill.addEventListener('click', (e) => {
      e.preventDefault();
      if (isPaused) return;
      colorMode = (colorMode + 1) % 4;
      bluePill.textContent = modeLabels[colorMode];
    });

    greenPill.addEventListener('click', (e) => {
      e.preventDefault();
      isPaused = !isPaused;
      greenPill.textContent = isPaused ? 'Re-Boot' : 'Green Pill';
    });

    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);
    const phraseData = Array(columns).fill(null).map(() => {
      if (Math.random() < 0.22) {
        return {
          phrase: phrases[Math.floor(Math.random() * phrases.length)],
          index: 0
        };
      }
      return null;
    });

    function getColor(isPhrase) {
      if (colorMode === 0) {
        return isPhrase ? '#ff8a8a' : '#ff1a1a';
      } else if (colorMode === 1) {
        return isPhrase ? '#c084fc' : '#a855f7';
      } else if (colorMode === 2) {
        return isPhrase ? '#fde047' : '#facc15';
      } else {
        // multicolored
        const colors = ['#ff1a1a', '#a855f7', '#facc15', '#22d3ee', '#4ade80', '#f472b6'];
        return colors[Math.floor(Math.random() * colors.length)];
      }
    }

    function getShadowColor() {
      if (colorMode === 0) return '#ff1a1a';
      if (colorMode === 1) return '#a855f7';
      if (colorMode === 2) return '#facc15';
      return '#ffffff';
    }

    function draw() {
      if (isPaused) return;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        let text;
        let isPhrase = false;

        if (phraseData[i]) {
          const p = phraseData[i];
          text = p.phrase[p.index];
          isPhrase = true;
          ctx.shadowColor = getShadowColor();
          ctx.shadowBlur = 10;

          p.index++;
          if (p.index >= p.phrase.length) {
            p.index = 0;
            if (Math.random() > 0.7) {
              phraseData[i] = null;
            }
          }
        } else {
          text = classic[Math.floor(Math.random() * classic.length)];
          ctx.shadowBlur = 0;
        }

        ctx.fillStyle = getColor(isPhrase);
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
          if (Math.random() < 0.22) {
            phraseData[i] = {
              phrase: phrases[Math.floor(Math.random() * phrases.length)],
              index: 0
            };
          }
        }
        drops[i]++;
      }
    }

    setInterval(draw, 88);

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
