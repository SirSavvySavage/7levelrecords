<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Level Records – Nexus</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-color: #0a0a0a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Pulsing background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('nexus.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
      100% {
        transform: scale(1);
      }
    }

    .back-link {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 12px 28px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
      transition: all 0.3s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .back-link:hover {
      color: #00ff41;
      border-color: #00ff41;
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.45);
    }
  </style>
</head>
<body>
  <a href="homepage.html" class="back-link">back to my reality</a>
</body>
</html>
