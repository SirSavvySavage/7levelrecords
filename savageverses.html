<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savage Verses</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('svbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .line {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      font-size: 1.15rem;
      letter-spacing: 1px;
      font-style: italic;
      opacity: 0.9;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
      text-align: center;
    }
    .back-link, .play-link {
      position: fixed;
      bottom: 40px;
      z-index: 10;
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      cursor: pointer;
      border: 1px solid;
    }
    .back-link {
      left: 18%;
      border-color: rgba(77, 166, 255, 0.5);
      color: #4da6ff;
    }
    .back-link:hover {
      color: #7ec8ff;
      border-color: #7ec8ff;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.45);
    }
    .play-link {
      right: 18%;
      border-color: rgba(255, 42, 42, 0.5);
      color: #ff2a2a;
    }
    .play-link:hover {
      color: #ff4d4d;
      border-color: #ff1a1a;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px rgba(255, 26, 26, 0.45);
    }
  </style>
</head>
<body>
  <div class="line">-Step To The Other Side-</div>
  <a href="savagedaffy.html" class="back-link">-Turn Around-</a>
  <button class="play-link" id="playSavage">Savage Verses</button>
  <audio id="savageTrack" src="Savage Verses.mp3" preload="auto"></audio>
  <script>
    const playBtn = document.getElementById('playSavage');
    const audio = document.getElementById('savageTrack');
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "Savage Verses";
      } else {
        audio.pause();
        playBtn.textContent = "Savage Verses";
      }
    });
  </script>
</body>
</html>
