<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savage Verses</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('svbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      z-index: 10;
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .label {
      font-size: 1.15rem;
      letter-spacing: 1px;
      font-style: italic;
      opacity: 0.9;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
      text-align: center;
    }
    .back-link,
    .play-link {
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      border: 2px solid;
      transition: all 0.3s ease;
      text-shadow:
        0 0 6px rgba(0,0,0,1),
        0 2px 10px rgba(0,0,0,1);
    }
    .back-link {
      color: #ffffff;
      border-color: #7ec8ff;
      background: rgba(30, 90, 180, 0.75);
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.45);
    }
    .back-link:hover {
      color: #ffffff;
      border-color: #b3e0ff;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.7);
    }
    .play-link {
      color: #ffffff;
      border-color: #ff4d4d;
      background: rgba(180, 20, 20, 0.75);
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.45);
    }
    .play-link:hover {
      color: #ffffff;
      border-color: #ff8080;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(255, 26, 26, 0.7);
    }
  </style>
</head>
<body>
  <div class="controls">
    <div class="col">
      <div class="label">Turn Around</div>
      <a href="savagedaffy.html" class="back-link">Wake Up</a>
    </div>
    <div class="col">
      <div class="label">-Step To The Other Side-</div>
      <button class="play-link" id="playSavage">Reflextion</button>
    </div>
  </div>
  <audio id="savageTrack" src="Reflextion.mp3" preload="auto"></audio>
  <script>
    const playBtn = document.getElementById('playSavage');
    const audio = document.getElementById('savageTrack');
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
  </script>
</body>
</html>
