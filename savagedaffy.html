<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SavageDaffy</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('sdbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .layout {
      position: absolute;
      top: 70%;
      left: 0;
      width: 100%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 3%;
      box-sizing: border-box;
      z-index: 10;
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 32%;
    }
    .title {
      font-size: 1.55rem;
      letter-spacing: 2px;
      margin: 0 0 0.45rem 0;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
    }
    .line2 {
      font-size: 1.12rem;
      letter-spacing: 2px;
      opacity: 0.9;
      margin-bottom: 0.55rem;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
    }
    .line3 {
      font-size: 0.8rem;
      letter-spacing: 1px;
      opacity: 0.85;
      font-style: italic;
      margin-bottom: 0.75rem;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
    }
    .back-link,
    .play-link,
    .hat-link {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      border: 2px solid;
      transition: all 0.3s ease;
      text-shadow:
        0 0 6px rgba(0,0,0,1),
        0 2px 10px rgba(0,0,0,1);
    }
    .back-link {
      color: #ffffff;
      border-color: #7ec8ff;
      background: rgba(30, 90, 180, 0.75);
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.45);
    }
    .back-link:hover {
      color: #ffffff;
      border-color: #b3e0ff;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.7);
    }
    .play-link,
    .hat-link {
      color: #ffffff;
      border-color: #ff4d4d;
      background: rgba(180, 20, 20, 0.75);
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.45);
    }
    .play-link:hover,
    .hat-link:hover {
      color: #ffffff;
      border-color: #ff8080;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(255, 26, 26, 0.7);
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="col">
      <a href="homepage.html" class="back-link">Wake Up</a>
    </div>
    <div class="col">
      <div class="title">=SAVAGE VERSES=</div>
      <div class="line2">Album Coming Soon</div>
      <div class="line3">-Down The Rabbit Hole Once More-</div>
      <a href="savageverses.html" class="play-link">Peek In The Mirror</a>
    </div>
    <div class="col">
      <div class="title">=THE MAD HATTER=</div>
      <div class="line2">11th Anniversary Re-Release</div>
      <div class="line3">-Remixed and Remastered-</div>
      <a href="themadhatter.html" class="hat-link">Back To Sleep</a>
    </div>
  </div>
</body>
</html>
