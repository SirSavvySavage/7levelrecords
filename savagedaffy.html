<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SavageDaffy</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('sdbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Dark fade overlay */
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }

    .center-text {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9);
    }

    .center-text h1 {
      font-size: 3.2rem;
      letter-spacing: 4px;
      margin: 0 0 0.6rem 0;
      font-weight: 700;
    }

    .center-text .coming {
      font-size: 1.6rem;
      letter-spacing: 3px;
      opacity: 0.9;
      margin-bottom: 1.2rem;
    }

    .center-text .tagline {
      font-size: 1.15rem;
      letter-spacing: 1px;
      opacity: 0.85;
      font-style: italic;
    }

    .button-row {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 10;
    }

    .back-link, .play-link {
      color: white;
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 12px 28px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      cursor: pointer;
      border: 1px solid;
    }

    /* Blue button - wake up */
    .back-link {
      border-color: rgba(77, 166, 255, 0.5);
      color: #4da6ff;
    }
    .back-link:hover {
      color: #7ec8ff;
      border-color: #7ec8ff;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.45);
    }

    /* Red button - Peek In The Mirror */
    .play-link {
      border-color: rgba(255, 42, 42, 0.5);
      color: #ff2a2a;
    }
    .play-link:hover {
      color: #ff4d4d;
      border-color: #ff1a1a;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px rgba(255, 26, 26, 0.45);
    }
  </style>
</head>
<body>

  <div class="center-text">
    <h1>=SAVAGE VERSES=</h1>
    <div class="coming">Album Coming Soon</div>
    <div class="tagline">-Down The Rabbit Hole Once More-</div>
  </div>

  <div class="button-row">
    <a href="homepage.html" class="back-link">Wake Up</a>
    <button class="play-link" id="playSavage">Peek In The Mirror</button>
  </div>

  <audio id="savageTrack" src="Savage Verses.mp3" preload="auto"></audio>

  <script>
    const playBtn = document.getElementById('playSavage');
    const audio = document.getElementById('savageTrack');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "I See You";
      } else {
        audio.pause();
        playBtn.textContent = "Peek In The Mirror";
      }
    });
  </script>
</body>
</html>
