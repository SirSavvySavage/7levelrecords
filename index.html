<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Level Records – Nexus</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-color: #0a0a0a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Pulsing background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('nexus.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.06);
      }
      100% {
        transform: scale(1);
      }
    }

    .back-link {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #ff2a2a;
      text-decoration: none;
      font-size: 1.6rem;
      letter-spacing: 2px;
      padding: 16px 36px;
      border: 1px solid rgba(255, 42, 42, 0.6);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
      text-shadow: 0 0 12px rgba(255, 26, 26, 0.6);
      font-family: monospace;
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.4);
    }
    .back-link:hover {
      color: #ff4d4d;
      border-color: #ff1a1a;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 0 24px rgba(255, 26, 26, 0.7), 0 0 48px rgba(255, 26, 26, 0.4);
      text-shadow: 0 0 16px rgba(255, 26, 26, 0.9);
    }
  </style>
</head>
<body>
  <a href="homepage.html" class="back-link" id="enterText">ENTER</a>

  <script>
    const versions = [
      'ENTER WITH CAUTION',
      '3^135 W!1= k4V5!0n',
      'enter with caution'
    ];
    const el = document.getElementById('enterText');
    const length = versions[0].length;
    const charState = new Array(length).fill(0);

    function updateText() {
      let result = '';
      for (let i = 0; i < length; i++) {
        result += versions[charState[i]][i];
      }
      el.textContent = result;
    }

    for (let i = 0; i < length; i++) {
      const interval = 2800 + Math.random() * 5000;
      setInterval(() => {
        charState[i] = (charState[i] + 1) % versions.length;
        updateText();
      }, interval);
    }

    updateText();
  </script>
</body>
</html>
