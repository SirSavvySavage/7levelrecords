<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Nethervoid</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('dark nethervoid.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .back-link {
      position: fixed;
      bottom: 40px;
      left: 10%;
      transform: translateX(-50%);
      z-index: 10;
      color: #4da6ff;
      text-decoration: none;
      font-size: 1.15rem;
      letter-spacing: 1px;
      padding: 12px 28px;
      border: 1px solid rgba(77, 166, 255, 0.5);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .back-link:hover {
      color: #7ec8ff;
      border-color: #7ec8ff;
      background: rgba(0, 0, 0, 0.6);
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.45);
    }
  </style>
</head>
<body>
  <a href="homepage.html" class="back-link">Wake Up</a>
