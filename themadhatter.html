<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mad Hatter</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('mhbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .top-center {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .wonder-label {
      color: #ffffff;
      font-size: 1.15rem;
      letter-spacing: 1px;
      font-style: italic;
      -webkit-text-stroke: 1px #ff2a2a;
      paint-order: stroke fill;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    .dream-btn {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      border: 2px solid #ff2a2a;
      color: #ffffff;
      background: rgba(180, 20, 20, 0.75);
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.45);
      -webkit-text-stroke: 0.6px #ff2a2a;
      paint-order: stroke fill;
      text-shadow: 0 0 6px rgba(0,0,0,1);
      transition: all 0.3s ease;
    }
    .dream-btn:hover {
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(255, 26, 26, 0.7);
    }
    .savvy-link,
    .deeper-btn {
      position: fixed;
      bottom: 40px;
      z-index: 10;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      border: 2px solid;
      transition: all 0.3s ease;
      text-shadow:
        0 0 6px rgba(0,0,0,1),
        0 2px 10px rgba(0,0,0,1);
    }
    .savvy-link {
      left: 4%;
      color: #ffffff;
      border-color: #7ec8ff;
      background: rgba(30, 90, 180, 0.75);
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.45);
    }
    .savvy-link:hover {
      border-color: #b3e0ff;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.7);
    }
    .deeper-btn {
      right: 4%;
      color: #ffffff;
      border-color: #ff4d4d;
      background: rgba(180, 20, 20, 0.75);
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.45);
    }
    .deeper-btn:hover {
      border-color: #ff8080;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 24px rgba(255, 26, 26, 0.7);
    }
    .deeper-btn.denied,
    .deeper-btn.denied:hover {
      color: #fff4c2;
      border-color: #e0c04a;
      background: rgba(160, 120, 20, 0.8);
      box-shadow: 0 0 18px rgba(201, 162, 39, 0.6);
    }
  </style>
</head>
<body>
  <div class="top-center">
    <div class="wonder-label">Back To Wonderland</div>
    <button class="dream-btn" id="dreamBtn">Dream</button>
  </div>
  <a href="savagedaffy.html" class="savvy-link">Wake Up</a>
  <button class="deeper-btn" id="deeperBtn">Go Deeper</button>
  <audio id="briarTrack" src="Briar Patch.mp3" preload="auto"></audio>
  <script>
    const dreamBtn = document.getElementById('dreamBtn');
    const briar = document.getElementById('briarTrack');
    dreamBtn.addEventListener('click', () => {
      if (briar.paused) {
        briar.play();
      } else {
        briar.pause();
      }
    });
    const deeperBtn = document.getElementById('deeperBtn');
    deeperBtn.addEventListener('click', () => {
      deeperBtn.textContent = "Rabbit Hole Denied";
      deeperBtn.classList.add('denied');
    });
  </script>
</body>
</html>
