<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mad Hatter</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      background-image: url('mhbackground.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
      animation: darkPulse 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes darkPulse {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .top-center {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    .wonder-label {
      color: #ffffff;
      font-size: 1.15rem;
      letter-spacing: 1px;
      font-style: italic;
      -webkit-text-stroke: 1px #ff2a2a;
      paint-order: stroke fill;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    /* Music Player */
    .player-container {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 42, 42, 0.5);
      border-radius: 16px;
      padding: 14px 22px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 30px rgba(255, 42, 42, 0.3);
      min-width: 280px;
      max-width: 90vw;
      text-align: center;
    }
    .track {
      margin: 6px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .track-title {
      font-size: 0.95rem;
      font-weight: 500;
    }
    audio {
      width: 170px;
      height: 32px;
      accent-color: #ff2a2a;
    }
    .dream-btn,
    .savvy-link,
    .deeper-btn,
    .merch-btn {
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      border: 2px solid transparent;
      background: #000000;
      color: #ffffff;
      transition: all 0.3s ease;
      text-shadow:
        0 0 6px rgba(0,0,0,1),
        0 2px 10px rgba(0,0,0,1);
    }
    .bottom-controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }
    .savvy-link {
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.7), 0 0 32px rgba(77, 166, 255, 0.4);
    }
    .savvy-link:hover {
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.9), 0 0 40px rgba(126, 200, 255, 0.5);
    }
    .deeper-btn {
      box-shadow: 0 0 16px rgba(255, 42, 42, 0.7), 0 0 32px rgba(255, 42, 42, 0.4);
    }
    .deeper-btn:hover {
      box-shadow: 0 0 24px rgba(255, 80, 80, 0.9), 0 0 40px rgba(255, 80, 80, 0.5);
    }
    .deeper-btn.denied,
    .deeper-btn.denied:hover {
      box-shadow: 0 0 18px rgba(255, 220, 50, 0.8), 0 0 32px rgba(255, 220, 50, 0.5);
    }
    .merch-btn {
      box-shadow: 0 0 16px rgba(57, 255, 20, 0.7), 0 0 32px rgba(57, 255, 20, 0.4);
    }
    .merch-btn:hover {
      box-shadow: 0 0 24px rgba(100, 255, 60, 0.9), 0 0 40px rgba(100, 255, 60, 0.5);
    }
  </style>
</head>
<body>
  <div class="top-center">
    <div class="wonder-label">Back To Wonderland</div>
    <div class="player-container">
      <div class="track">
        <span class="track-title">BRIAR PATCH</span>
        <audio controls>
          <source src="Briar Patch.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>
  </div>
  <div class="bottom-controls">
    <a href="savagedaffy.html" class="savvy-link">Wake Up</a>
    <a href="https://7levelrecordsmerch.bigcartel.com/" class="merch-btn">RELICS</a>
    <a href="mhgodeeper.html" class="deeper-btn" id="deeperBtn">Go Deeper</a>
  </div>
</body>
</html>
