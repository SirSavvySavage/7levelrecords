<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Level Records — Secret Page</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #050505;
      background-image: url('mhsecretpagebackground.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .page-title {
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 20px rgba(77, 166, 255, 0.4);
    }
    .page-title h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 1.5px;
      line-height: 1.2;
    }
    .page-title p {
      margin: 6px 0 0 0;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      font-weight: 500;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 20px 100px;
      text-align: center;
    }
    /* Music Player */
    .player-container {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(77, 166, 255, 0.4);
      border-radius: 16px;
      padding: 16px 24px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 30px rgba(77, 166, 255, 0.25);
      min-width: 320px;
      max-width: 90vw;
    }
    .track {
      margin: 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .track-title { font-size: 0.9rem; font-weight: 500; }
    audio { width: 170px; height: 32px; accent-color: #4da6ff; }

    /* Video */
    .video-container {
      width: min(80vw, 700px);
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(77, 166, 255, 0.35);
      background: #000;
    }
    .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Slideshow */
    .slideshow {
      width: min(70vw, 520px);
      height: 280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(77, 166, 255, 0.3);
      background: #000;
      position: relative;
      cursor: pointer;
    }
    .slideshow img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
    }
    .slideshow img.active { display: block; }
    .slide-controls {
      position: absolute;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 11;
    }
    .slide-btn {
      background: rgba(0,0,0,0.7);
      color: white;
      border: 1px solid rgba(77, 166, 255, 0.6);
      border-radius: 50%;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .slide-btn:hover { background: rgba(77, 166, 255, 0.4); }

    /* Button */
    .bottom-controls {
      position: fixed;
      bottom: 25px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }
    .return-btn {
      text-decoration: none;
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.7px;
      padding: 8px 20px;
      border-radius: 999px;
      background: #000; color: #fff;
      box-shadow: 0 0 16px rgba(77, 166, 255, 0.7), 0 0 32px rgba(77, 166, 255, 0.4);
      transition: all 0.3s;
    }
    .return-btn:hover {
      box-shadow: 0 0 24px rgba(126, 200, 255, 0.9), 0 0 40px rgba(126, 200, 255, 0.5);
    }

    /* Lightbox */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      max-width: 92vw;
      max-height: 92vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content img {
      max-width: 92vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
    }
    .close-modal {
      position: absolute;
      top: 10px; right: 10px;
      background: #000;
      color: #fff;
      border: 1px solid #4da6ff;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 20px;
      cursor: pointer;
      z-index: 101;
    }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(77, 166, 255, 0.6);
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 101;
    }
    .gallery-nav:hover { background: rgba(77, 166, 255, 0.4); }
    .gallery-nav.prev { left: -60px; }
    .gallery-nav.next { right: -60px; }
    @media (max-width: 700px) {
      .gallery-nav.prev { left: 10px; }
      .gallery-nav.next { right: 10px; }
    }
  </style>
</head>
<body>
  <div class="content">
    <!-- Title -->
    <div class="page-title">
      <h1>MAD HATTER SUPER SECRET PAGE</h1>
      <p>(Only accessible with QR code)</p>
    </div>

    <!-- Music Player -->
    <div class="player-container">
      <div class="track">
        <span class="track-title">Mad Hatters Mastered 2026</span>
        <audio controls>
          <source src="Mad Hatters Mastered 2026.mp3" type="audio/mpeg">
        </audio>
      </div>
      <div class="track">
        <span class="track-title">Hunnit Barz Mastered 2026</span>
        <audio controls>
          <source src="Hunnit Barz Mastered 2026.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>

    <!-- YouTube Video -->
    <div class="video-container">
      <iframe
        src="https://www.youtube-nocookie.com/embed/HoUfYFICLA4?rel=0&modestbranding=1&playsinline=1"
        title="Secret Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow" onclick="openGallery()">
      <img class="active" src="photo1.jpg" alt="Photo 1">
      <img src="photo2.jpg" alt="Photo 2">
      <img src="photo3.jpg" alt="Photo 3">
      <img src="photo4.jpg" alt="Photo 4">
      <img src="photo5.jpg" alt="Photo 5">
      <img src="photo6.jpg" alt="Photo 6">
      <img src="photo7.jpg" alt="Photo 7">
      <img src="photo8.jpg" alt="Photo 8">
      <img src="photo9.jpg" alt="Photo 9">
      <img src="photo10.jpg" alt="Photo 10">
      <img src="photo11.jpg" alt="Photo 11">
      <img src="photo12.jpg" alt="Photo 12">
      <img src="photo13.jpg" alt="Photo 13">
      <img src="photo14.jpg" alt="Photo 14">
      <img src="photo15.jpg" alt="Photo 15">
      <img src="photo16.jpg" alt="Photo 16">
      <img src="photo17.jpg" alt="Photo 17">
      <img src="photo18.jpg" alt="Photo 18">
      <div class="slide-controls" onclick="event.stopPropagation()">
        <button class="slide-btn" onclick="changeSlide(-1)">&#10094;</button>
        <button class="slide-btn" onclick="changeSlide(1)">&#10095;</button>
      </div>
    </div>
  </div>

  <div class="bottom-controls">
    <a href="../homepage.html" class="return-btn">Wake Up</a>
  </div>

  <!-- Gallery Modal -->
  <div class="modal" id="galleryModal" onclick="closeModals()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModals()">×</button>
      <button class="gallery-nav prev" onclick="modalChange(-1)">&#10094;</button>
      <img id="modalImg" src="" alt="Expanded">
      <button class="gallery-nav next" onclick="modalChange(1)">&#10095;</button>
    </div>
  </div>

  <script>
    let slideIndex = 0;
    const slides = document.querySelectorAll('#slideshow img');
    function showSlide(n) {
      slides.forEach(s => s.classList.remove('active'));
      slideIndex = (n + slides.length) % slides.length;
      slides[slideIndex].classList.add('active');
    }
    function changeSlide(dir) { showSlide(slideIndex + dir); }
    setInterval(() => changeSlide(1), 5000);

    function openGallery() {
      document.getElementById('modalImg').src = slides[slideIndex].src;
      document.getElementById('galleryModal').classList.add('active');
    }
    function modalChange(dir) {
      showSlide(slideIndex + dir);
      document.getElementById('modalImg').src = slides[slideIndex].src;
    }
    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }
  </script>
</body>
</html>
